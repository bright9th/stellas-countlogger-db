name: Export Static Files

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */1 * *"

# Prevent two instances from amending/pushing simultaneously.
concurrency:
  group: export-files-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          permission-contents: write
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Export Files
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run export

      - name: Get GitHub App bot Identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq '.id')
          echo "user-id=$USER_ID" >> "$GITHUB_OUTPUT"

      - name: Configure Git Identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_ID: ${{ steps.bot.outputs.user-id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Commit or Amend
        id: commit
        run: |
          MARKER="[bot:export-file]"

          # Check whether exported files have changed.
          git add export/

          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if HEAD is already owned by this workflow.
          LAST_COMMIT=$(git log -1 --format=%B)

          if echo "$LAST_COMMIT" | grep -Fq "$MARKER"; then
            echo "Previous workflow commit found. Amending..."

            git commit --amend --no-edit
          else
            echo "No previous workflow commit found. Creating new commit..."

            git commit -m "chore: update exported files $MARKER"
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git push origin HEAD:main --force-with-lease
